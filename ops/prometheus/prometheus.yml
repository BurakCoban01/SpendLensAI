global:
  scrape_interval: 15s
  scrape_timeout: 12s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: spendlens-api
    static_configs:
      - targets: ["host.docker.internal:18621"]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]
