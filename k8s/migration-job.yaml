apiVersion: batch/v1
kind: Job
metadata:
  name: spendlens-migrate
  namespace: spendlens
spec:
  template:
    spec:
      serviceAccountName: spendlens-runtime
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      containers:
        - name: migrate
          image: spendlens/api:local
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "waiting for postgres";
                sleep 2;
              done;
              pnpm --dir packages/db exec prisma migrate deploy
          envFrom:
            - configMapRef:
                name: spendlens-config
            - secretRef:
                name: spendlens-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
