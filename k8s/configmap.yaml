apiVersion: v1
kind: ConfigMap
metadata:
  name: spendlens-config
  namespace: spendlens
data:
  NODE_ENV: production
  LOG_LEVEL: info
  API_PORT: "4000"
  WEB_PORT: "3000"
  OCR_SERVICE_PORT: "8000"
  NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
  CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
  RATE_LIMIT_MAX: "300"
  RATE_LIMIT_TIME_WINDOW: 1 minute
  DOCUMENT_MAX_UPLOAD_BYTES: "26214400"
  MINIO_BUCKET_DOCUMENTS: spendlens-documents
  MINIO_BUCKET_ARTIFACTS: spendlens-artifacts
  OCR_SERVICE_URL: http://spendlens-ocr-service:8000
  TESSERACT_LANGS: tur+eng
  WORKER_API_BASE_URL: http://spendlens-api:4000
  WORKER_ID: k8s-dedicated-worker
  WORKER_INTERVAL_MS: "1000"
  WORKER_MAX_JOBS_PER_TICK: "5"
  EVENT_CONSUMER_CLIENT_ID: spendlens-event-consumer
  EVENT_CONSUMER_GROUP_ID: spendlens-event-consumers
  EVENT_CONSUMER_NAME: k8s-event-consumer
  EVENT_DRAINER_API_BASE_URL: http://spendlens-api:4000
  EVENT_DRAINER_ID: k8s-event-drainer
  EVENT_DRAINER_INTERVAL_MS: "5000"
  EVENT_DRAINER_LIMIT: "25"
  EVENT_DRAINER_INCLUDE_FAILED: "false"
