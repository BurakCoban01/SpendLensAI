apiVersion: v1
kind: Secret
metadata:
  name: spendlens-secrets
  namespace: spendlens
type: Opaque
stringData:
  POSTGRES_USER: spendlens
  POSTGRES_PASSWORD: replace_me
  POSTGRES_DB: spendlens
  DATABASE_URL: postgresql://spendlens:replace_me@postgres:5432/spendlens?schema=public
  REDIS_URL: redis://redis:6379
  KAFKA_BROKERS: redpanda:9092
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ROOT_USER: spendlens
  MINIO_ROOT_PASSWORD: replace_me
  JWT_ACCESS_SECRET: replace_me_jwt_access_secret_32_chars
  JWT_REFRESH_SECRET: replace_me_jwt_refresh_secret_32_chars
  API_KEY_PEPPER: replace_me_api_key_pepper_32_chars
  SESSION_COOKIE_SECRET: replace_me_session_cookie_secret_32_chars
  WORKER_ACCESS_TOKEN: replace_me_worker_access_token
  WORKER_TENANT_SLUG: replace_me
  WORKER_EMAIL: replace_me
  WORKER_PASSWORD: replace_me
  EVENT_DRAINER_ACCESS_TOKEN: replace_me_event_drainer_access_token
  EVENT_DRAINER_TENANT_SLUG: replace_me
  EVENT_DRAINER_EMAIL: replace_me
  EVENT_DRAINER_PASSWORD: replace_me
