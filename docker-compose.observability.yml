services:
  prometheus:
    image: prom/prometheus:v2.52.0
    ports:
      - "${PROMETHEUS_HOST_PORT:-19090}:9090"
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "${GRAFANA_HOST_PORT:-13001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-spendlens-local-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    profiles: ["observability"]

volumes:
  grafana-data:
